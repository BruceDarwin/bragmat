# Bragmat iOS build — unsigned compile check (iOS-3A)
#
# Purpose: prove the iOS project compiles natively on a hosted macOS
# machine. No code signing, no distribution — that is iOS-3B.
#
# Prerequisite (set in Codemagic UI, never in this file):
#   Variable group "bragmat_public" containing:
#     SUPABASE_URL       — public project URL (publishable config)
#     SUPABASE_ANON_KEY  — publishable anon key (RLS-enforced, public)
#   No service-role key. No WORLDTIDES_API_KEY — that stays server-side
#   on Supabase and is never part of any client build.
workflows:
  # iOS-3C diagnostic: runs pod install + inspects Runner.xcodeproj phase
  # ordering only. No IPA build, no signing, no publishing.
  ios-pod-diag:
    name: iOS pod install diagnostic
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.1
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: pod install
        script: |
          cd ios && pod install
      - name: Fetch vendored libsodium xcframework
        # prepare_command doesn't run for :path pods — invoke the package's
        # own download script so darwin/Libraries/libsodium.xcframework exists.
        script: |
          set -e
          PLUG=$(cd ios/.symlinks/plugins/sodium_libs 2>/dev/null && pwd -P || true)
          (cd "$PLUG/darwin" && dart run ../tool/libsodium/download.dart darwin) \
            || { echo "libsodium download failed"; exit 1; }
          test -d "$PLUG/darwin/Libraries/libsodium.xcframework" \
            || { echo "libsodium.xcframework missing after download"; exit 1; }
          echo "downloaded: $PLUG/darwin/Libraries/libsodium.xcframework"
      - name: Populate corrected libsodium binaryTarget
        # local_packages/sodium_libs is the dependency_overrides copy —
        # Flutter's .packages links now resolve to it, so the corrected
        # path-based binaryTarget survives regeneration. Download the
        # vendored xcframework, strip arm64e, place it at
        # darwin/sodium_libs/Libraries/libsodium.xcframework (the path the
        # rewritten Package.swift binaryTarget expects).
        script: |
          set -e
          SRC=$(cd ios/.symlinks/plugins/sodium_libs && pwd -P)/darwin/Libraries/libsodium.xcframework
          [ -d "$SRC" ] || { echo "vendored xcframework missing"; exit 1; }
          DEST="local_packages/sodium_libs/darwin/sodium_libs/Libraries"
          mkdir -p "$DEST"; rm -rf "$DEST/libsodium.xcframework"
          cp -R "$SRC" "$DEST/libsodium.xcframework"
          find "$DEST/libsodium.xcframework" -name libsodium -type f | while read -r bin; do
            echo "before: $bin -> $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64e && lipo -remove arm64e "$bin" -o "$bin"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64 || { echo "FAIL: arm64 missing"; exit 1; }
            echo "after:  $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done
          python3 - "$DEST/libsodium.xcframework/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]; info = plistlib.load(open(p,'rb'))
          for lib in info.get('AvailableLibraries', []):
              sa = lib.get('SupportedArchitectures', [])
              if 'arm64e' in sa: sa.remove('arm64e'); lib['SupportedArchitectures']=sa
          plistlib.dump(info, open(p,'wb'))
          PY
          grep -n "binaryTarget" local_packages/sodium_libs/darwin/sodium_libs/Package.swift
      - name: Verify SPM resolves local binaryTarget
        script: |
          set -e
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner
          echo "== artifact tree post-resolve =="
          find build/ios/SourcePackages -name "*sodium*" -o -name "*libsodium*" | head -20
  ios-unsigned-compile:
    name: iOS unsigned compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - bragmat_public
      flutter: 3.44.1      # pinned — must match Windows dev SDK
      xcode: 26.6          # pinned — current Codemagic stable default
      cocoapods: default
    scripts:
      - name: Materialise .env from protected variables
        script: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          # Sanity: both values must be non-empty, never printed
          test -s .env && grep -q '=.' .env
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze (baseline guard)
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unsigned iOS build
        script: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=.env
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - bruceraymonddunn@gmail.com

  # iOS-3B — App Store signed build ONLY. Produces a signed IPA artifact;
  # it does NOT upload or submit anything. TestFlight publishing is a
  # separate, explicitly approved step (see notes in the runbook): either
  # re-enable the commented publishing block below, or use Codemagic's
  # manual "Publish to App Store Connect" action on the finished build.
  #
  # Do NOT trigger until: (a) Apple Developer membership is active,
  # (b) the App Store Connect integration "bragmat_asc" exists (API key,
  #      App Manager role — Developer role can sign but cannot upload),
  # (c) an App record for com.bragmat.app exists in App Store Connect.
  # Signing is App Store distribution — required for TestFlight delivery.
  ios-testflight:
    name: iOS signed build for TestFlight (iOS-3B)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bragmat_asc
    environment:
      groups:
        - bragmat_public
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bragmat.app
      flutter: 3.44.1
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Materialise .env from protected variables
        script: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          test -s .env && grep -q '=.' .env
      - name: flutter pub get
        script: flutter pub get
      - name: pod install (fetch vendored libsodium)
        script: |
          cd ios && pod install
      - name: Fetch vendored libsodium xcframework
        # CocoaPods does not run prepare_command for :path pods — invoke the
        # package's own download script so the vendored xcframework exists.
        # arm64e stripping happens in the Runner build phase (before
        # [CP] Embed Pods Frameworks signs it) — see ios/Podfile.
        script: |
          set -e
          PLUG=$(cd ios/.symlinks/plugins/sodium_libs 2>/dev/null && pwd -P || true)
          echo "sodium_libs plugin: $PLUG"
          (cd "$PLUG/darwin" && dart run ../tool/libsodium/download.dart darwin) \
            || { echo "libsodium download failed"; exit 1; }
          test -d "$PLUG/darwin/Libraries/libsodium.xcframework" \
            || { echo "libsodium.xcframework missing after download"; exit 1; }
          echo "downloaded: $PLUG/darwin/Libraries/libsodium.xcframework"
      - name: Set up code signing
        # Applies the fetched cert + App Store profile to the project and
        # writes export_options.plist — ios_signing does not populate
        # $EXPORT_OPTIONS by itself.
        script: xcode-project use-profiles
      - name: Verify export options plist
        script: |
          test -s "$HOME/export_options.plist" || \
            { echo "export_options.plist missing or empty"; exit 1; }
      - name: Populate corrected libsodium binaryTarget
        # local_packages/sodium_libs is the dependency_overrides copy —
        # Flutter's .packages links now resolve to it, so the corrected
        # path-based binaryTarget survives regeneration. Download the
        # vendored xcframework, strip arm64e, place it at
        # darwin/sodium_libs/Libraries/libsodium.xcframework (the path the
        # rewritten Package.swift binaryTarget expects).
        script: |
          set -e
          SRC=$(cd ios/.symlinks/plugins/sodium_libs && pwd -P)/darwin/Libraries/libsodium.xcframework
          [ -d "$SRC" ] || { echo "vendored xcframework missing"; exit 1; }
          DEST="local_packages/sodium_libs/darwin/sodium_libs/Libraries"
          mkdir -p "$DEST"; rm -rf "$DEST/libsodium.xcframework"
          cp -R "$SRC" "$DEST/libsodium.xcframework"
          find "$DEST/libsodium.xcframework" -name libsodium -type f | while read -r bin; do
            echo "before: $bin -> $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64e && lipo -remove arm64e "$bin" -o "$bin"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64 || { echo "FAIL: arm64 missing"; exit 1; }
            echo "after:  $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done
          python3 - "$DEST/libsodium.xcframework/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]; info = plistlib.load(open(p,'rb'))
          for lib in info.get('AvailableLibraries', []):
              sa = lib.get('SupportedArchitectures', [])
              if 'arm64e' in sa: sa.remove('arm64e'); lib['SupportedArchitectures']=sa
          plistlib.dump(info, open(p,'wb'))
          PY
          grep -n "binaryTarget" local_packages/sodium_libs/darwin/sodium_libs/Package.swift
      - name: Signed IPA (App Store profile)
        script: |
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define-from-file=.env
      - name: Verify embedded libsodium architectures
        # Operates on the final IPA (not the pub-cache framework):
        # arm64 must be present, arm64e must be absent, and the embedded
        # app + framework signatures must be valid — before publishing.
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          [ -n "$IPA" ] || { echo "IPA not found"; exit 1; }
          rm -rf /tmp/ipa_verify && unzip -o -q "$IPA" -d /tmp/ipa_verify
          BIN=/tmp/ipa_verify/Payload/Runner.app/Frameworks/libsodium.framework/libsodium
          [ -f "$BIN" ] || { echo "embedded libsodium missing"; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "embedded libsodium archs: $ARCHS"
          echo "$ARCHS" | grep -qw arm64 || { echo "FAIL: arm64 missing"; exit 1; }
          echo "$ARCHS" | grep -qw arm64e && { echo "FAIL: arm64e still present"; exit 1; }
          codesign -v /tmp/ipa_verify/Payload/Runner.app && echo "app signature valid"
          codesign -v /tmp/ipa_verify/Payload/Runner.app/Frameworks/libsodium.framework && echo "framework signature valid"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/strip_evidence.log
    publishing:
      email:
        recipients:
          - bruceraymonddunn@gmail.com
      # iOS-3C one-off: upload the built IPA to the Bragmat Oz ASC record
      # via the bragmat_asc integration. Upload only — no TestFlight beta
      # submission, no App Store review submission, no group assignment.
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # iOS-3C instrumented diagnostic — identical to ios-testflight but with
  # NO publishing block: builds the signed IPA, verifies embedded
  # libsodium, collects strip_evidence.log. Upload is impossible.
  ios-archive-diag:
    name: iOS instrumented archive diagnostic (no publish)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bragmat_asc
    environment:
      groups:
        - bragmat_public
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bragmat.app
      flutter: 3.44.1
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Materialise .env from protected variables
        script: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          test -s .env && grep -q '=.' .env
      - name: flutter pub get
        script: flutter pub get
      - name: pod install (fetch vendored libsodium)
        script: |
          cd ios && pod install
      - name: Fetch vendored libsodium xcframework
        script: |
          set -e
          PLUG=$(cd ios/.symlinks/plugins/sodium_libs 2>/dev/null && pwd -P || true)
          (cd "$PLUG/darwin" && dart run ../tool/libsodium/download.dart darwin) \
            || { echo "libsodium download failed"; exit 1; }
          test -d "$PLUG/darwin/Libraries/libsodium.xcframework" \
            || { echo "libsodium.xcframework missing after download"; exit 1; }
          echo "downloaded: $PLUG/darwin/Libraries/libsodium.xcframework"
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Populate corrected libsodium binaryTarget
        # local_packages/sodium_libs is the dependency_overrides copy —
        # Flutter's .packages links now resolve to it, so the corrected
        # path-based binaryTarget survives regeneration. Download the
        # vendored xcframework, strip arm64e, place it at
        # darwin/sodium_libs/Libraries/libsodium.xcframework (the path the
        # rewritten Package.swift binaryTarget expects).
        script: |
          set -e
          SRC=$(cd ios/.symlinks/plugins/sodium_libs && pwd -P)/darwin/Libraries/libsodium.xcframework
          [ -d "$SRC" ] || { echo "vendored xcframework missing"; exit 1; }
          DEST="local_packages/sodium_libs/darwin/sodium_libs/Libraries"
          mkdir -p "$DEST"; rm -rf "$DEST/libsodium.xcframework"
          cp -R "$SRC" "$DEST/libsodium.xcframework"
          find "$DEST/libsodium.xcframework" -name libsodium -type f | while read -r bin; do
            echo "before: $bin -> $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64e && lipo -remove arm64e "$bin" -o "$bin"
            lipo -archs "$bin" | tr ' ' '\n' | grep -qx arm64 || { echo "FAIL: arm64 missing"; exit 1; }
            echo "after:  $(lipo -archs "$bin") sha=$(shasum -a 256 "$bin" | cut -d' ' -f1)"
          done
          python3 - "$DEST/libsodium.xcframework/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]; info = plistlib.load(open(p,'rb'))
          for lib in info.get('AvailableLibraries', []):
              sa = lib.get('SupportedArchitectures', [])
              if 'arm64e' in sa: sa.remove('arm64e'); lib['SupportedArchitectures']=sa
          plistlib.dump(info, open(p,'wb'))
          PY
          grep -n "binaryTarget" local_packages/sodium_libs/darwin/sodium_libs/Package.swift
      - name: Verify SPM resolves local binaryTarget
        script: |
          set -e
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner
          echo "== artifact tree post-resolve =="
          find build/ios/SourcePackages -name "*sodium*" -o -name "*libsodium*" | head -20
      - name: Signed IPA (instrumented, verbose)
        script: |
          set -o pipefail
          mkdir -p ios/build
          flutter build ipa --release --verbose \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define-from-file=.env 2>&1 | tee ios/build/verbose_build.log
      - name: Dump strip evidence
        # Echo evidence into the step log — retrievable even when the
        # verify step fails and artifact collection is skipped.
        script: |
          echo "=== strip_evidence.log ==="
          cat ios/build/strip_evidence.log 2>/dev/null || echo "EVIDENCE FILE NOT FOUND"
          echo "=== end ==="
      - name: Verbose libsodium provenance extract
        # Focused extract of the verbose xcodebuild transcript — names the
        # operation that copies/embeds libsodium into Runner.app.
        script: |
          grep -in "libsodium\|ProcessXCFramework\|Embed.*ramework\|rsync\|native_assets" \
            ios/build/verbose_build.log | head -60 || echo "no libsodium references in verbose log"
      - name: Verify embedded libsodium architectures
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          [ -n "$IPA" ] || { echo "IPA not found"; exit 1; }
          rm -rf /tmp/ipa_verify && unzip -o -q "$IPA" -d /tmp/ipa_verify
          BIN=/tmp/ipa_verify/Payload/Runner.app/Frameworks/libsodium.framework/libsodium
          [ -f "$BIN" ] || { echo "embedded libsodium missing"; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "embedded libsodium archs: $ARCHS"
          echo "$ARCHS" | grep -qw arm64 || { echo "FAIL: arm64 missing"; exit 1; }
          echo "$ARCHS" | grep -qw arm64e && { echo "FAIL: arm64e still present"; exit 1; }
          codesign -v /tmp/ipa_verify/Payload/Runner.app && echo "app signature valid"
          codesign -v /tmp/ipa_verify/Payload/Runner.app/Frameworks/libsodium.framework && echo "framework signature valid"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/strip_evidence.log
      - ios/build/verbose_build.log

  # Secondary path — development-signed IPA for direct device install.
  # Only useful with a capable macOS host (Apple Configurator 2 installs a
  # signed IPA without re-signing; Sideloadly/3uTools re-sign and are
  # rejected as an install method). Requires the device UDID registered at
  # developer.apple.com → Devices. Keep disabled until that host exists.
  ios-signed-device:
    name: iOS signed device build (deferred)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bragmat_asc
    environment:
      groups:
        - bragmat_public
      ios_signing:
        distribution_type: development
        bundle_identifier: com.bragmat.app
      flutter: 3.44.1
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Materialise .env from protected variables
        script: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          test -s .env && grep -q '=.' .env
      - name: flutter pub get
        script: flutter pub get
      - name: Signed IPA (development profile)
        script: |
          flutter build ipa --release \
            --export-options-plist=$EXPORT_OPTIONS \
            --dart-define-from-file=.env
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/build/strip_evidence.log
    publishing:
      email:
        recipients:
          - bruceraymonddunn@gmail.com
